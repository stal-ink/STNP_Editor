[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "regression-py-stnp"
version = "0.9.1"
description = "Generated STNP Python protocol runtime for regression_py"
requires-python = ">=3.10"
dependencies = [
  "PyYAML>=6,<7",  "pyserial>=3.5,<4",]

[tool.setuptools.packages.find]
where = ["."]
include = ["stnp*"]

[tool.setuptools.package-data]
stnp = ["protocol/*.yaml", "sdk/uart/*.yaml"]
